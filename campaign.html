<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campaign</title>

    <link rel="stylesheet" href="campaign.css">
</head>

<body>

    <main class="campaign">

        <header class="campaign-header">

            <h1>CAMPAIGN</h1>

            <div class="bankroll">

                <span>BANKROLL</span>

                <strong>$500</strong>

            </div>

        </header>


        <section class="tables">

            <button class="table-card">

                <div class="table-info">

                    <h2>BEGINNER</h2>

                    <p class="bet-range">
                        $1 – $20
                    </p>

                    <p class="entry">
                        Entry: $0
                    </p>

                </div>

                <div class="locked-text">
                    PLAY
                </div>

            </button>


            <button class="table-card">

                <div class="table-info">

                    <h2>BRONZE</h2>

                    <p class="bet-range">
                        $5 – $100
                    </p>

                    <p class="entry">
                        Entry: $2,500
                    </p>

                </div>

                <div class="locked-text">
                    🔒 LOCKED
                </div>

            </button>


            <button class="table-card">

                <div class="table-info">

                    <h2>SILVER</h2>

                    <p class="bet-range">
                        $25 – $500
                    </p>

                    <p class="entry">
                        Entry: $12,500
                    </p>

                </div>

                <div class="locked-text">
                    🔒 LOCKED
                </div>

            </button>


            <button class="table-card">

                <div class="table-info">

                    <h2>GOLD</h2>

                    <p class="bet-range">
                        $100 – $2,000
                    </p>

                    <p class="entry">
                        Entry: $50,000
                    </p>

                </div>

                <div class="locked-text">
                    🔒 LOCKED
                </div>

            </button>


            <button class="table-card">

                <div class="table-info">

                    <h2>PLATINUM</h2>

                    <p class="bet-range">
                        $500 – $10,000
                    </p>

                    <p class="entry">
                        Entry: $250,000
                    </p>

                </div>

                <div class="locked-text">
                    🔒 LOCKED
                </div>

            </button>


            <button class="table-card">

                <div class="table-info">

                    <h2>DIAMOND</h2>

                    <p class="bet-range">
                        $2,500 – $50,000
                    </p>

                    <p class="entry">
                        Entry: $1,250,000
                    </p>

                </div>

                <div class="locked-text">
                    🔒 LOCKED
                </div>

            </button>


            <button class="table-card">

                <div class="table-info">

                    <h2>ROYAL</h2>

                    <p class="bet-range">
                        $10,000 – $200,000
                    </p>

                    <p class="entry">
                        Entry: $5,000,000
                    </p>

                </div>

                <div class="locked-text">
                    🔒 LOCKED
                </div>

            </button>


            <button class="table-card">

                <div class="table-info">

                    <h2>PRIVATE</h2>

                    <p class="bet-range">
                        $50,000 – $1,000,000
                    </p>

                    <p class="entry">
                        Entry: $25,000,000
                    </p>

                </div>

                <div class="locked-text">
                    🔒 LOCKED
                </div>

            </button>


            <button class="table-card">

                <div class="table-info">

                    <h2>ELITE</h2>

                    <p class="bet-range">
                        $250,000 – $5,000,000
                    </p>

                    <p class="entry">
                        Entry: $125,000,000
                    </p>

                </div>

                <div class="locked-text">
                    🔒 LOCKED
                </div>

            </button>


            <button class="table-card">

                <div class="table-info">

                    <h2>GRAND</h2>

                    <p class="bet-range">
                        $1,000,000 – $20,000,000
                    </p>

                    <p class="entry">
                        Entry: $500,000,000
                    </p>

                </div>

                <div class="locked-text">
                    🔒 LOCKED
                </div>

            </button>


            <button class="table-card">

                <div class="table-info">

                    <h2>IMPERIAL</h2>

                    <p class="bet-range">
                        $5,000,000 – $100,000,000
                    </p>

                    <p class="entry">
                        Entry: $2,500,000,000
                    </p>

                </div>

                <div class="locked-text">
                    🔒 LOCKED
                </div>

            </button>


            <button class="table-card">

                <div class="table-info">

                    <h2>VIP</h2>

                    <p class="bet-range">
                        $25,000,000 – $500,000,000
                    </p>

                    <p class="entry">
                        Entry: $12,500,000,000
                    </p>

                </div>

                <div class="locked-text">
                    🔒 LOCKED
                </div>

            </button>

        </section>


        <button
            class="back-button"
            onclick="window.location.href='index.html'"
        >
            BACK
        </button>


        <button
            id="reset-campaign-button"
            class="reset-button"
        >
            RESET CAMPAIGN
        </button>


    </main>


    <script src="campaign.js"></script>

</body>

</html>
